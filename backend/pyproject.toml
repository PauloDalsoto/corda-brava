[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Corda Brava backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "azure-servicebus>=7.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24",
]
metrics = [
    "matplotlib>=3.8",
    "azure-identity>=1.16",
    "azure-monitor-query>=1.3,<2",  # 2.0 removed MetricsQueryClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
ignore = [
    "ANN001",  # allow unannotated function arguments where type is obvious
    "ANN002",  # *args
    "ANN003",  # **kwargs
    "ANN201",  # return type for public function (pytest fixtures don't need it)
    "ANN202",  # return type for private function
]

[tool.black]
line-length = 100
target-version = ["py311"]
